<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Products</title>
  <style>
    /* Global body */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      color: #333;
      transition: background 0.3s, color 0.3s;
    }

    /* Navigation Bar */
    nav {
      text-align: center;
      margin-bottom: 20px;
      background-color: #007BFF;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 15px;
    }
    nav a {
      display: inline-block;
      color: white;
      padding: 12px 25px;
      margin: 5px 10px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    nav a:hover {
      background-color: #0056b3;
      transform: translateY(-3px);
    }

    /* Controls */
    .controls {
      text-align: center;
      margin-bottom: 20px;
    }
    .controls button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      background-color: #28a745;
    }

    /* Carousel */
    .carousel-container {
      overflow: hidden;
      max-width: 900px;
      margin: 0 auto 30px auto;
    }

    .carousel-track {
      display: flex;
      transition: transform 1s ease-in-out;
      gap: 20px;
    }

    /* Each product row (card) */
    .product-row {
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: box-shadow 0.3s ease;
      flex: 0 0 250px; /* fixed width for carousel */
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    .product-row:hover,
    .product-row:focus-within {
      box-shadow: 0 0 25px rgba(26, 188, 156, 0.7);
    }

    /* Product image */
    .product-row img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .product-row img:hover,
    .product-row img:focus {
      transform: scale(1.1);
      outline: none;
    }

    /* Product info container */
    .product-info {
      margin-top: 12px;
      width: 100%;
      text-align: center;
    }

    /* Price styling */
    .price {
      font-size: 18px;
      font-weight: bold;
      color: #1abc9c;
      margin-bottom: 10px;
    }

    /* Buy button styling */
    .buy-btn {
      background-color: #1abc9c;
      color: white;
      border: none;
      padding: 10px 25px;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      box-shadow: 0 4px 6px rgba(26,188,156,0.4);
    }

    .buy-btn:hover,
    .buy-btn:focus {
      background-color: #159f8f;
      outline: none;
    }

    /* Responsive for small screens */
    @media (max-width: 600px) {
      .carousel-track {
        flex-wrap: wrap;
        justify-content: center;
      }
      .product-row {
        flex: 0 0 80%;
      }
    }

    /* Dark Mode */
    .dark-mode {
      background: #222;
      color: white;
    }
    .dark-mode nav {
      background-color: #0056b3;
    }
    .dark-mode .product-row {
      background: #333;
      color: #eee;
    }
    .dark-mode .price {
      color: #1abc9c;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <a href="home.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact Us</a>
    <a href="place.html">Place</a>
    <a href="product.html">Products</a>
  </nav>

  <!-- Controls -->
  <div class="controls">
    <button onclick="toggleLanguage()">🌍 English / Swahili</button>
    <button onclick="toggleLight()">💡 Light ON / OFF</button>
  </div>

  <!-- Carousel Container -->
  <div class="carousel-container">
    <div class="carousel-track" id="carouselTrack">

      <div class="product-row">
        <img src="25.jpg" alt="Product 1" />
        <div class="product-info">
          <p class="price" data-en="1kg cost 3,000 TSh<br>100kg cost 270,000 TSh" 
             data-sw="1kg gharama 3,000 TSh<br>100kg gharama 270,000 TSh">
             1kg cost 3,000 TSh<br>100kg cost 270,000 TSh
          </p>
          <button class="buy-btn">BUY NOW</button>
        </div>
      </div>

      <div class="product-row">
        <img src="26.jpg" alt="Product 2" />
        <div class="product-info">
          <p class="price" data-en="For Cleansing free" data-sw="Kwa Usafi bure">
            For Cleansing free
          </p>
          <button class="buy-btn">BUY NOW</button>
        </div>
      </div>

      <div class="product-row">
        <img src="27.jpg" alt="Product 3" />
        <div class="product-info">
          <p class="price" data-en="Farm Process" data-sw="Mchakato wa Shamba">Farm Process</p>
          <button class="buy-btn">BUY NOW</button>
        </div>
      </div>

      <div class="product-row">
        <img src="28.jpg" alt="Product 4" />
        <div class="product-info">
          <p class="price" data-en="Ready for being harvested" data-sw="Tayari kuvunwa">Ready for being harvested</p>
          <button class="buy-btn">BUY NOW</button>
        </div>
      </div>

      <div class="product-row">
        <img src="14.jpg" alt="Sweet Potatoes" />
        <div class="product-info">
          <p class="price" data-en="Sweet Potatoes<br>1kg cost 1,000 TSh<br>100kg cost 90,000 TSh" 
             data-sw="Viazi vitamu<br>1kg gharama 1,000 TSh<br>100kg gharama 90,000 TSh">
             Sweet Potatoes<br>1kg cost 1,000 TSh<br>100kg cost 90,000 TSh
          </p>
          <button class="buy-btn">BUY NOW</button>
        </div>
      </div>

      <div class="product-row">
        <img src="50.jpg" alt="Product 6" />
        <div class="product-info">
          <p class="price" data-en="Ready for being transported and delivery in and outside the country" 
             data-sw="Tayari kusafirishwa na kupelekwa ndani na nje ya nchi">
             Ready for being transported and delivery in and outside the country
          </p>
          <button class="buy-btn">BUY NOW</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Language toggle
    let isEnglish = true;
    function toggleLanguage() {
      const prices = document.querySelectorAll('.price');
      prices.forEach(p => {
        p.innerHTML = isEnglish ? p.getAttribute('data-sw') : p.getAttribute('data-en');
      });
      isEnglish = !isEnglish;
    }

    // Dark/light mode toggle
    function toggleLight() {
      document.body.classList.toggle('dark-mode');
    }

    // Carousel sliding
    const track = document.getElementById('carouselTrack');
    let index = 0;
    const totalItems = track.children.length;

    function slideCarousel() {
      index++;
      if (index >= totalItems) index = 0;
      const slideWidth = track.children[0].offsetWidth + 20; // 20 = gap
      track.style.transform = `translateX(-${index * slideWidth}px)`;
    }

    setInterval(slideCarousel, 3000); // slide every 3s
  </script>

</body>
</html>
